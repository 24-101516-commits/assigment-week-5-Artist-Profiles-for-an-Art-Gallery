<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palette | Artists Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header" id="home">
<a href="#home" class="logo">
<h1 id="logo-name"></h1>
<p id="logo-sub"></p>
</a>
<nav class="nav">
<ul>
<li><a href="#home" id="nav-home"></a></li>
<li><a href="#about" id="nav-about"></a></li>
<li><a href="#artists" id="nav-artists"></a></li>
<li><a href="#contact" id="nav-contact"></a></li>
</ul>
</nav>
<a href="#artists" class="header-btn" id="header-explore"></a>
</header>
<main>
<section class="hero">
<div class="hero-text">
<p class="small-title" id="hero-small"></p>
<h1 id="hero-title"></h1>
<p class="hero-desc" id="hero-desc"></p>
<a href="#artists" class="btn" id="hero-btn"></a>
<div class="hero-bottom">
<strong id="hero-number"></strong>
<p id="hero-count"></p>
</div>
</div>
<img src="img/Classical Muse and Frida Collage.png" class="hero-image" alt="Art Collage">
</section>
<section class="styles">
<h2 id="styles-title"></h2>
<div class="style-list" id="style-list"></div>
</section>
<section class="artists" id="artists">
<div class="artists-heading">
<h2 id="artists-title"></h2>
<div class="controls">
<input type="text" id="search" placeholder="Search artists...">
<button class="filter-btn active" data-category="All">All</button>
<button class="filter-btn" data-category="Painting">Painting</button>
<button class="filter-btn" data-category="Sculpture">Sculpture</button>
<button class="filter-btn" data-category="Modern Art">Modern Art</button>
<button class="filter-btn" data-category="Surrealism">Surrealism</button>
</div>
</div>
<ul class="artist-grid" id="artist-list"></ul>
</section>
