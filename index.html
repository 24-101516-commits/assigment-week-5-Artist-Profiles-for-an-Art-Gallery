<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palette | Artists Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header" id="home">
<a href="#home" class="logo">
<h1 id="logo-name"></h1>
<p id="logo-sub"></p>
</a>
<nav class="nav">
<ul>
<li><a href="#home" id="nav-home"></a></li>
<li><a href="#about" id="nav-about"></a></li>
<li><a href="#artists" id="nav-artists"></a></li>
<li><a href="#contact" id="nav-contact"></a></li>
</ul>
</nav>
<a href="#artists" class="header-btn" id="header-explore"></a>
</header>
<main>
<section class="hero">
<div class="hero-text">
<p class="small-title" id="hero-small"></p>
<h1 id="hero-title"></h1>
<p class="hero-desc" id="hero-desc"></p>
<a href="#artists" class="btn" id="hero-btn"></a>
<div class="hero-bottom">
<strong id="hero-number"></strong>
<p id="hero-count"></p>
</div>
</div>
<img src="img/Classical Muse and Frida Collage.png" class="hero-image" alt="Art Collage">
</section>
<section class="styles">
<h2 id="styles-title"></h2>
<div class="style-list" id="style-list"></div>
</section>
<section class="artists" id="artists">
<div class="artists-heading">
<h2 id="artists-title"></h2>
<div class="controls">
<input type="text" id="search" placeholder="Search artists...">
<button class="filter-btn active" data-category="All">All</button>
<button class="filter-btn" data-category="Painting">Painting</button>
<button class="filter-btn" data-category="Sculpture">Sculpture</button>
<button class="filter-btn" data-category="Modern Art">Modern Art</button>
<button class="filter-btn" data-category="Surrealism">Surrealism</button>
</div>
</div>
<ul class="artist-grid" id="artist-list"></ul>
</section>
<section class="about" id="about">
<img src="img/about_statue_art.png" alt="Classical sculpture">
<div class="about-text">
<p class="small-title" id="about-label"></p>
<h2 id="about-title"></h2>
<p id="about-desc"></p>
<a href="#artists" class="btn" id="about-btn"></a>
</div>
</section>
</main>
<footer class="footer" id="contact">
<div class="footer-brand">
<h2 id="footer-logo"></h2>
<p id="footer-sub"></p>
<p id="footer-desc"></p>
</div>
<div class="footer-links">
<h3 id="footer-links-title"></h3>
<ul>
<li><a href="#home" id="footer-home"></a></li>
<li><a href="#about" id="footer-about"></a></li>
<li><a href="#artists" id="footer-artists"></a></li>
<li><a href="#contact" id="footer-contact"></a></li>
</ul>
</div>
<div class="footer-contact">
<h3 id="footer-contact-title"></h3>
<p id="footer-email"></p>
<p id="footer-phone"></p>
<p id="footer-city"></p>
</div>
<div class="footer-newsletter">
<h3 id="newsletter-title"></h3>
<p id="newsletter-desc"></p>
<div class="newsletter-form">
<input type="email" id="newsletter-email" placeholder="Your email address">
<button id="newsletter-btn"></button>
</div>
<p id="newsletter-message"></p>
</div>
</footer>
<div class="modal" id="artist-modal">
<div class="modal-box">
<button class="close-btn" id="close-modal">×</button>
<img id="modal-image" src="" alt="Artist">
<div class="modal-content">
<h2 id="modal-name"></h2>
<p id="modal-age"></p>
<p id="modal-specialist"></p>
<p id="modal-city"></p>
<p id="modal-email"></p>
<p id="modal-bio"></p>
</div>
</div>
</div>
<script>
document.getElementById("logo-name").innerHTML="Palette.";
document.getElementById("logo-sub").innerHTML="ARTISTS GALLERY";
document.getElementById("nav-home").innerHTML="Home";
document.getElementById("nav-about").innerHTML="About";
document.getElementById("nav-artists").innerHTML="Artists";
document.getElementById("nav-contact").innerHTML="Contact";
document.getElementById("header-explore").innerHTML="Explore Artists →";
document.getElementById("hero-small").innerHTML="CREATIVE MINDS · TIMELESS STORIES";
document.getElementById("hero-title").innerHTML="Artists<br>Shape Our <span>World</span>";
document.getElementById("hero-desc").innerHTML="Discover the lives, artworks, and stories of 16 influential artists from different eras, styles, and cultures. Explore how creativity connects people across time.";
document.getElementById("hero-btn").innerHTML="Explore Artists →";
document.getElementById("hero-number").innerHTML="16+";
document.getElementById("hero-count").innerHTML="Remarkable Artists";
document.getElementById("styles-title").innerHTML="Explore<br>by Style";
document.getElementById("artists-title").innerHTML="Our Artists";
document.getElementById("about-label").innerHTML="ABOUT US";
document.getElementById("about-title").innerHTML="Celebrating <span>Creative</span> Minds";
document.getElementById("about-desc").innerHTML="Palette is a platform dedicated to showcasing the stories, artworks, and journeys of extraordinary artists from around the world. We believe that art connects cultures, inspires people, and makes the world a more creative and open place.";
document.getElementById("about-btn").innerHTML="Explore Artists →";
document.getElementById("footer-logo").innerHTML="Palette.";
document.getElementById("footer-sub").innerHTML="ARTISTS GALLERY";
document.getElementById("footer-desc").innerHTML="Art lives through people, stories, and endless creativity.";
document.getElementById("footer-links-title").innerHTML="Quick Links";
document.getElementById("footer-home").innerHTML="Home";
document.getElementById("footer-about").innerHTML="About";
document.getElementById("footer-artists").innerHTML="Artists";
document.getElementById("footer-contact").innerHTML="Contact";
document.getElementById("footer-contact-title").innerHTML="Contact Us";
document.getElementById("footer-email").innerHTML="info@palette.com";
document.getElementById("footer-phone").innerHTML="+20 123 456 789";
document.getElementById("footer-city").innerHTML="Cairo, Egypt";
document.getElementById("newsletter-title").innerHTML="Newsletter";
document.getElementById("newsletter-desc").innerHTML="Join our creative community.";
document.getElementById("newsletter-btn").innerHTML="→";
let styles=["Painting","Sculpture","Photography","Modern Art","Surrealism","Contemporary Art"];
for(let i=0;i<styles.length;i++){
document.getElementById("style-list").innerHTML+='<div class="style-item">'+styles[i]+'</div>';
}
let artists=[
{name:"Vincent van Gogh",age:"1853 – 1890 (37 years)",specialist:"Post-Impressionist Painter",city:"Zundert, Netherlands",email:"vangogh@palette.com",bio:"Dutch painter known for his expressive brushwork, vibrant colors, and emotional depth.",image:"img/vincent_van_gogh.png",category:"Painting"},
{name:"Frida Kahlo",age:"1907 – 1954 (47 years)",specialist:"Surrealist Painter",city:"Coyoacán, Mexico",email:"frida@palette.com",bio:"Mexican painter known for her self-portraits, exploring identity, pain, and cultural heritage.",image:"img/frida_kahlo.png",category:"Surrealism"},
{name:"Leonardo da Vinci",age:"1452 – 1519 (67 years)",specialist:"Renaissance Artist",city:"Vinci, Italy",email:"leonardo@palette.com",bio:"Italian painter and inventor, known for masterpieces like the Mona Lisa and The Last Supper.",image:"img/leonardo_da_vinci.png",category:"Painting"},
{name:"Pablo Picasso",age:"1881 – 1973 (91 years)",specialist:"Cubist Artist",city:"Málaga, Spain",email:"picasso@palette.com",bio:"Spanish artist who co-founded Cubism and redefined modern art with bold experimentation.",image:"img/pablo_picasso.png",category:"Modern Art"},
{name:"Claude Monet",age:"1840 – 1926 (86 years)",specialist:"Impressionist Painter",city:"Paris, France",email:"monet@palette.com",bio:"French painter and a founder of Impressionism, famous for his landscapes and light-filled works.",image:"img/claude_monet.png",category:"Painting"},
{name:"Georgia O'Keeffe",age:"1887 – 1986 (98 years)",specialist:"Modernist Painter",city:"Sun Prairie, United States",email:"okeeffe@palette.com",bio:"American painter known for her large-scale flowers, landscapes, and organic forms.",image:"img/georgia_okeeffe.png",category:"Modern Art"},
{name:"Salvador Dalí",age:"1904 – 1989 (84 years)",specialist:"Surrealist Painter",city:"Figueres, Spain",email:"dali@palette.com",bio:"Spanish surrealist known for his dreamlike imagery and eccentric personality.",image:"img/salvador_dali.png",category:"Surrealism"},
{name:"Yayoi Kusama",age:"1929 – Present",specialist:"Contemporary Artist",city:"Matsumoto, Japan",email:"kusama@palette.com",bio:"Japanese artist known for her immersive installations, polka dots, and exploration of infinity.",image:"img/andy_warhol.png",category:"Modern Art"},
{name:"Rembrandt",age:"1606 – 1669 (63 years)",specialist:"Baroque Painter",city:"Leiden, Netherlands",email:"rembrandt@palette.com",bio:"Dutch master known for his dramatic use of light and shadow, and deep emotional portraits.",image:"img/rembrandt.png",category:"Painting"},
{name:"Johannes Vermeer",age:"1632 – 1675 (43 years)",specialist:"Baroque Painter",city:"Delft, Netherlands",email:"vermeer@palette.com",bio:"Dutch painter famous for his intimate scenes, realistic details, and masterful use of light.",image:"img/johannes_vermeer.png",category:"Painting"},
{name:"Henri Matisse",age:"1869 – 1954 (84 years)",specialist:"Modernist Painter",city:"Le Cateau-Cambrésis, France",email:"matisse@palette.com",bio:"French artist known for his bold use of color, simple forms, and expressive compositions.",image:"img/henri_matisse.png",category:"Modern Art"},
{name:"Andy Warhol",age:"1928 – 1987 (58 years)",specialist:"Pop Art Artist",city:"Pittsburgh, United States",email:"warhol@palette.com",bio:"American artist and leading figure in Pop Art, known for iconic images and exploration of consumer culture.",image:"img/andy_warhol.png",category:"Modern Art"},
{name:"Edvard Munch",age:"1863 – 1944 (80 years)",specialist:"Expressionist Painter",city:"Ådalsbruk, Norway",email:"munch@palette.com",bio:"Norwegian painter known for his emotional works, including The Scream.",image:"img/edvard_munch.png",category:"Painting"},
{name:"Gustav Klimt",age:"1862 – 1918 (55 years)",specialist:"Symbolist Painter",city:"Baumgarten, Austria",email:"klimt@palette.com",bio:"Austrian painter known for his decorative style, rich patterns, and use of gold leaf.",image:"img/gustav_klimt.png",category:"Painting"},
{name:"Pierre-Auguste Renoir",age:"1841 – 1919 (78 years)",specialist:"Impressionist Painter",city:"Limoges, France",email:"renoir@palette.com",bio:"French painter known for his lively scenes, warm colors, and celebration of everyday life.",image:"img/pierre_auguste_renoir.png",category:"Painting"},
{name:"Michelangelo",age:"1475 – 1564 (88 years)",specialist:"Sculptor & Painter",city:"Caprese, Italy",email:"michelangelo@palette.com",bio:"Italian sculptor, painter, and architect, renowned for the statue of David and the Sistine Chapel.",image:"img/michelangelo.png",category:"Sculpture"}
];
for(let i=0;i<artists.length;i++){
document.getElementById("artist-list").innerHTML+='<li class="artist-card"><img src="'+artists[i].image+'" alt="'+artists[i].name+'"><div class="artist-info"><h3>'+artists[i].name+'</h3><p><b>Age:</b> '+artists[i].age+'</p><p><b>Specialist:</b> '+artists[i].specialist+'</p><p><b>City:</b> '+artists[i].city+'</p><p><b>Email:</b> '+artists[i].email+'</p><p class="bio">'+artists[i].bio+'</p><button class="details-btn">View Details →</button></div></li>';
}
document.getElementById("close-modal").addEventListener("click",function(){
document.getElementById("artist-modal").style.display="none";
});
document.getElementById("newsletter-btn").addEventListener("click",function(){
document.getElementById("newsletter-message").innerHTML="Thank you for your interest!";
});
</script>
</body>
</html>
